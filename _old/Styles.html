<style>
/* ============================================================
   Styles.html — Estilos globales Corral del Sol Intranet
   ============================================================ */

/* ---- Variables ---- */
:root {
  --brand:       #1a6b3c;
  --brand-dark:  #145230;
  --brand-light: #e8f5ee;
  --accent:      #f4a823;
  --danger:      #d32f2f;
  --danger-bg:   #fdecea;
  --ok:          #1b8a3c;
  --ok-bg:       #e8f5ee;
  --text:        #1a1a2e;
  --text-muted:  #6b7280;
  --border:      #e5e7eb;
  --bg:          #f3f4f6;
  --white:       #ffffff;
  --radius:      10px;
  --shadow:      0 2px 8px rgba(0,0,0,.08);
  --transition:  .18s ease;
}

/* ---- Reset & base ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'Google Sans', 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}

/* ---- Header ---- */
.app-header {
  background: var(--brand);
  color: var(--white);
  padding: .75rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

.header-brand { display: flex; align-items: center; gap: .6rem; }
.brand-name   { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }

.header-user  { display: flex; align-items: center; gap: .75rem; }
.user-name    { font-size: .9rem; opacity: .9; }

.user-badge {
  font-size: .75rem;
  font-weight: 700;
  padding: .25rem .65rem;
  border-radius: 999px;
  background: rgba(255,255,255,.2);
}

/* ---- Main ---- */
.app-main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

/* ---- Cards ---- */
.card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.card-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand);
  margin-bottom: 1rem;
  padding-bottom: .5rem;
  border-bottom: 2px solid var(--brand-light);
}

.card-hint {
  font-size: .875rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
}

.card-summary { background: var(--brand-light); border-color: var(--brand); }
.card--table  { overflow-x: auto; }

/* ---- Section header ---- */
.section-header { margin-bottom: 1.5rem; }
.section-header h1 { font-size: 1.5rem; font-weight: 800; color: var(--brand); }
.section-subtitle  { color: var(--text-muted); font-size: .9rem; margin-top: .25rem; }

/* ---- Grid ---- */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}

/* ---- Fields ---- */
.field { display: flex; flex-direction: column; gap: .35rem; }
.field--wide { grid-column: span 2; }
.field label { font-size: .85rem; font-weight: 600; color: var(--text); }

.field input,
.field select,
.field textarea {
  padding: .55rem .8rem;
  border: 1.5px solid var(--border);
  border-radius: 7px;
  font-size: .95rem;
  font-family: inherit;
  color: var(--text);
  background: var(--white);
  transition: border-color var(--transition), box-shadow var(--transition);
  width: 100%;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(26,107,60,.12);
}

.field textarea { resize: vertical; min-height: 80px; }
.field-display  { font-weight: 600; color: var(--brand); padding: .4rem 0; }

.req { color: var(--danger); }

.computed-field {
  padding: .55rem .8rem;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 7px;
  font-size: .95rem;
  font-weight: 700;
  color: var(--brand);
}

/* ---- Denominaciones ---- */
.denom-tipo-sep {
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-muted);
  grid-column: 1 / -1;
  padding: .25rem 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: .25rem;
}

.denom-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: .5rem .75rem;
  margin-bottom: .75rem;
}

.denom-item {
  display: grid;
  grid-template-columns: auto 70px auto;
  gap: .4rem;
  align-items: center;
}

.denom-label  { font-size: .9rem; font-weight: 600; }
.denom-input  { padding: .4rem .5rem; border: 1.5px solid var(--border); border-radius: 6px;
                font-size: .9rem; text-align: right; width: 70px; }
.denom-input:focus { outline: none; border-color: var(--brand); }
.denom-subtotal { font-size: .8rem; color: var(--text-muted); white-space: nowrap; }

/* ---- Totals ---- */
.total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: .75rem 1rem;
  background: var(--bg);
  border-radius: 8px;
  margin-top: .75rem;
  font-weight: 700;
}

.total-value { font-size: 1.1rem; color: var(--brand); }

.result-highlight {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 1.25rem;
  background: var(--brand);
  color: var(--white);
  border-radius: 8px;
  margin-top: 1rem;
  font-weight: 700;
}

.result-value { font-size: 1.25rem; }

/* ---- Summary grid ---- */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: .75rem;
  margin-bottom: 1rem;
}

.summary-item {
  background: var(--white);
  border-radius: 8px;
  padding: .75rem 1rem;
  border: 1px solid var(--border);
}

.summary-item--salidas .summary-value { color: var(--danger); }
.summary-item--glory   .summary-value { color: #7c3aed; }

.summary-label { font-size: .78rem; font-weight: 600; text-transform: uppercase;
                 letter-spacing: .04em; color: var(--text-muted); display: block; }
.summary-value { font-size: 1.05rem; font-weight: 800; color: var(--brand);
                 display: block; margin-top: .15rem; }

.total-general {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--brand); color: var(--white);
  padding: 1rem 1.25rem; border-radius: 8px;
  font-size: 1.1rem; font-weight: 800;
}

.total-general-value { font-size: 1.4rem; }

/* ---- Dynamic rows ---- */
.dynamic-row {
  display: flex;
  gap: .75rem;
  align-items: flex-start;
  padding: .75rem;
  background: var(--bg);
  border-radius: 8px;
  margin-bottom: .5rem;
  border: 1px solid var(--border);
}

.dynamic-row-fields { display: flex; flex-wrap: wrap; gap: .75rem; flex: 1; }
.dynamic-row-fields .field { min-width: 120px; flex: 1; }

/* ---- File uploads ---- */
.file-upload-area {
  border: 2px dashed var(--border);
  border-radius: 10px;
  padding: 2rem;
  text-align: center;
  transition: border-color var(--transition);
  cursor: pointer;
}

.file-upload-area:hover { border-color: var(--brand); }
.file-input { display: none; }

.file-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .5rem;
  cursor: pointer;
  color: var(--text-muted);
  font-size: .9rem;
}

.file-icon { font-size: 2.5rem; }

.file-mini { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.file-mini input[type="file"] { display: none; }
.file-mini-name { font-size: .78rem; color: var(--text-muted); }

/* ---- Buttons ---- */
.btn-submit {
  background: var(--brand);
  color: var(--white);
  border: none;
  padding: .75rem 2rem;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: background var(--transition), transform .1s;
  font-family: inherit;
}

.btn-submit:hover   { background: var(--brand-dark); }
.btn-submit:active  { transform: scale(.98); }
.btn-submit:disabled { opacity: .5; cursor: not-allowed; }

.btn-secondary {
  background: var(--white);
  color: var(--brand);
  border: 1.5px solid var(--brand);
  padding: .55rem 1.25rem;
  border-radius: 8px;
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background var(--transition);
}

.btn-secondary:hover { background: var(--brand-light); }

.btn-add {
  background: none;
  color: var(--brand);
  border: 1.5px dashed var(--brand);
  padding: .5rem 1rem;
  border-radius: 7px;
  font-size: .875rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: .5rem;
  font-family: inherit;
  width: 100%;
  transition: background var(--transition);
}

.btn-add:hover { background: var(--brand-light); }

.btn-remove {
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 1rem;
  padding: .25rem .5rem;
  border-radius: 5px;
  flex-shrink: 0;
  align-self: center;
}

.btn-remove:hover { background: var(--danger-bg); }

.btn-file {
  background: var(--brand-light);
  color: var(--brand);
  border: 1px solid var(--brand);
  padding: .3rem .75rem;
  border-radius: 5px;
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.btn-nav {
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: .3rem .7rem;
  cursor: pointer;
  font-size: 1rem;
  color: var(--brand);
  font-family: inherit;
}

.btn-nav:hover { background: var(--brand-light); }

.btn-xs {
  font-size: .75rem;
  padding: .2rem .5rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--white);
  cursor: pointer;
  font-family: inherit;
  margin-right: .25rem;
}

.btn-xs--primary { border-color: var(--brand); color: var(--brand); }
.btn-xs--primary:hover { background: var(--brand-light); }
.btn-sm { font-size: .85rem; padding: .4rem .9rem; }

.form-actions {
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
  padding-top: 1rem;
  flex-wrap: wrap;
}

/* ---- Tab navigation ---- */
.tab-nav {
  display: flex;
  gap: .5rem;
  margin-bottom: 1.5rem;
  background: var(--white);
  padding: .5rem;
  border-radius: 10px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.tab-btn {
  flex: 1;
  padding: .6rem;
  border: none;
  border-radius: 7px;
  background: none;
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--text-muted);
  font-family: inherit;
  transition: all var(--transition);
}

.tab-btn.active { background: var(--brand); color: var(--white); }
.tab-btn:hover:not(.active) { background: var(--brand-light); color: var(--brand); }

.sub-tab-nav {
  display: flex;
  gap: .5rem;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}

.sub-tab-btn {
  padding: .5rem 1rem;
  border: 1.5px solid var(--border);
  border-radius: 7px;
  background: var(--white);
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--text-muted);
  font-family: inherit;
  transition: all var(--transition);
}

.sub-tab-btn.active { background: var(--brand); color: var(--white); border-color: var(--brand); }

/* ---- Month selector ---- */
.month-selector {
  display: flex;
  align-items: center;
  gap: .75rem;
  flex-wrap: wrap;
}

.month-label {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--brand);
  min-width: 160px;
  text-align: center;
}

/* ---- Comparison table ---- */
.comparison-table {
  width: 100%;
  border-collapse: collapse;
  font-size: .85rem;
}

.comparison-table th {
  background: var(--brand);
  color: var(--white);
  padding: .6rem .75rem;
  text-align: left;
  font-weight: 700;
  white-space: nowrap;
}

.comparison-table td {
  padding: .55rem .75rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

.comparison-table tr:hover td   { background: var(--brand-light); }
.comparison-table .row-revisada { background: #f0fdf4; }

.comparison-table .num    { text-align: right; font-variant-numeric: tabular-nums; }
.comparison-table .center { text-align: center; }

.diff--ok  { color: var(--ok);     font-weight: 700; }
.diff--pos { color: #1d6fb8;       font-weight: 700; }
.diff--neg { color: var(--danger); font-weight: 700; }

/* ---- Role badges ---- */
.role-badge {
  display: inline-block;
  font-size: .75rem;
  font-weight: 700;
  padding: .2rem .6rem;
  border-radius: 999px;
}

.role-admin    { background: #7c3aed22; color: #7c3aed; }
.role-revisora { background: #1d6fb822; color: #1d6fb8; }
.role-cajera   { background: var(--brand-light); color: var(--brand); }

/* ---- Detail panel ---- */
.detalle-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}

.btn-icon {
  background: none;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--text-muted);
  padding: .25rem .5rem;
  border-radius: 4px;
}

.btn-icon:hover { background: var(--bg); }

.detalle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1rem;
}

.detalle-section h3 { font-size: .9rem; font-weight: 700; color: var(--brand); margin-bottom: .5rem; }
.detalle-section--full { grid-column: 1 / -1; }

dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; }
dt { font-size: .8rem; font-weight: 600; color: var(--text-muted); align-self: baseline; }
dd { font-size: .9rem; color: var(--text); }

/* ---- Loading / overlay ---- */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  color: var(--white);
  gap: 1rem;
}

.spinner {
  width: 48px; height: 48px;
  border: 5px solid rgba(255,255,255,.3);
  border-top-color: var(--white);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-inline {
  color: var(--text-muted);
  font-size: .9rem;
  padding: 1.5rem;
  text-align: center;
}

/* ---- Modal ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 900;
  padding: 1rem;
}

.modal-box {
  background: var(--white);
  border-radius: 12px;
  padding: 2rem;
  max-width: 600px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 8px 32px rgba(0,0,0,.2);
}

.modal-close {
  position: absolute;
  top: 1rem; right: 1rem;
  background: none; border: none; font-size: 1.1rem; cursor: pointer;
  color: var(--text-muted);
}

/* ---- Toast ---- */
#toast-container {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  max-width: 360px;
}

.toast {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  padding: .85rem 1.1rem;
  border-radius: 10px;
  font-size: .88rem;
  font-weight: 500;
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
  animation: slideIn .2s ease;
}

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}

.toast--success { background: var(--ok-bg);    color: var(--ok);     border: 1px solid var(--ok); }
.toast--error   { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
.toast--warning { background: #fffbeb;          color: #92400e;       border: 1px solid #fcd34d; }
.toast--info    { background: #eff6ff;          color: #1e40af;       border: 1px solid #93c5fd; }

.toast button {
  background: none; border: none; cursor: pointer; font-size: .9rem;
  opacity: .6; color: inherit; flex-shrink: 0;
}

/* ---- Utilities ---- */
.hidden       { display: none !important; }
.text-muted   { color: var(--text-muted); }
.error        { color: var(--danger); }
.empty-state  { text-align: center; padding: 2.5rem; color: var(--text-muted); }

/* ---- Responsive ---- */
@media (max-width: 600px) {
  .app-main         { padding: 1rem .75rem 3rem; }
  .grid-2           { grid-template-columns: 1fr; }
  .field--wide      { grid-column: span 1; }
  .denom-grid       { grid-template-columns: 1fr 1fr; }
  .tab-btn          { font-size: .78rem; padding: .5rem .4rem; }
  .comparison-table { font-size: .78rem; }
  .dynamic-row      { flex-direction: column; }
  .form-actions     { justify-content: stretch; }
  .btn-submit       { width: 100%; text-align: center; }
}
</style>
